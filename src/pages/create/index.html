<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List - YoBid Auction House</title>
    <script type="module" src="../../js/main.js"></script>
    <link rel="shortcut icon" href="/favicon.ico" />
  </head>
  <body class="bg-brand-body flex flex-col min-h-screen">
    <div id="app" class="flex-grow">
      <nav
        class="bg-brand-nav h-auto md:h-[73px] shadow-md flex items-center py-4 md:py-0"
      >
        <div class="max-w-7xl mx-auto px-8 w-full">
          <div
            class="flex flex-col md:flex-row justify-between items-center w-full gap-4 md:gap-0"
          >
            <!-- Logo -->
            <div class="w-full flex justify-between items-center md:w-auto">
              <a href="/" class="flex items-center justify-center -ml-4">
                <img
                  src="../../assets/images/logo.png"
                  alt="YoBid Logo"
                  class="h-12 md:h-14"
                />
              </a>

              <!-- Hamburger Button (only visible on small screens) -->
              <button
                id="menuToggle"
                class="md:hidden text-brand-text focus:outline-none"
              >
                <svg
                  class="w-8 h-8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 6h16M4 12h16m-7 6h7"
                  />
                </svg>
              </button>
            </div>

            <!-- Nav Links (collapsible on mobile) -->
            <div
              id="navMenu"
              class="hidden md:flex flex-col md:flex-row items-center w-full md:w-auto gap-4 md:gap-0"
            >
              <div
                data-auth="logged-out"
                class="flex flex-col md:flex-row items-center gap-4 md:gap-6"
              >
                <a href="/" class="text-brand-text hover:text-opacity-80"
                  >Home</a
                >
                <a
                  href="/src/pages/login/index.html"
                  class="text-brand-text hover:text-opacity-80"
                  >Login</a
                >
                <a
                  href="/src/pages/register/index.html"
                  class="text-brand-text hover:text-opacity-80"
                  >Register</a
                >
              </div>

              <!-- Logged-in State -->
              <div
                data-auth="logged-in"
                class="hidden flex flex-col md:flex-row items-center gap-4 md:gap-6"
              >
                <a href="/" class="text-brand-text hover:text-opacity-80"
                  >Home</a
                >
                <a
                  href="/src/pages/create/index.html"
                  class="text-brand-text hover:text-opacity-80 font-bold"
                  >Sell</a
                >
                <a
                  href="/src/pages/profile/index.html"
                  class="text-brand-text hover:text-opacity-80"
                  >Profile</a
                >
                <span class="text-brand-text"
                  >Credits: <span data-credits>0</span></span
                >
                <button
                  class="text-brand-text hover:text-opacity-80"
                  data-logout
                >
                  Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <main class="max-w-7xl mx-auto px-8 mt-16 mb-16">
        <h1 class="text-4xl font-semibold text-center text-brand-text mb-8">
          SELL
        </h1>

        <div class="bg-[#F4F3EE] rounded-lg p-8 max-w-xl mx-auto">
          <form id="create-listing-form" class="space-y-6">
            <div>
              <input
                type="text"
                id="title"
                name="title"
                required
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Title"
              />
            </div>

            <div>
              <textarea
                id="description"
                name="description"
                rows="4"
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Description"
              ></textarea>
            </div>

            <div>
              <input
                type="text"
                id="tags"
                name="tags"
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Tags (separated by comma)"
              />
            </div>

            <div>
              <input
                type="text"
                id="media"
                name="media"
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Image URLs (separated by comma)"
              />
            </div>

            <div>
              <input
                type="datetime-local"
                id="endsAt"
                name="endsAt"
                required
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
              />
            </div>

            <button
              type="submit"
              class="w-full bg-[#E0AFA0] text-white px-6 py-3 rounded-lg hover:bg-opacity-90 transition-colors"
            >
              LIST
            </button>
          </form>
        </div>
      </main>
    </div>

    <footer class="bg-brand-nav text-brand-text text-center py-6">
      ©2025 YoBid Auction House. Developed by Nik Bishop.
    </footer>
  </body>
</html>
