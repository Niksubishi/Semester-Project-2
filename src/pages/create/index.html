<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YoBid - Online Auction House</title>
    <script type="module" src="../../js/main.js"></script>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body class="bg-brand-body">
    <div id="app">
      <nav
        class="bg-brand-nav h-auto md:h-[73px] shadow-md flex items-center py-4 md:py-0"
      >
        <div class="max-w-7xl mx-auto px-8 w-full">
          <div
            class="flex flex-col md:flex-row justify-between items-center w-full gap-4 md:gap-0"
          >
            <a href="/" class="flex items-center justify-center -ml-4">
              <img
                src="../../assets/images/logo.png"
                alt="YoBid Logo"
                class="h-12 md:h-14"
              />
            </a>

            <!-- Nav Links -->
            <div class="flex items-center space-x-6">
              <div data-auth="logged-out">
                <a href="/" class="text-brand-text hover:text-opacity-80"
                  >Home</a
                >
                <a
                  href="/src/pages/login/index.html"
                  class="text-brand-text hover:text-opacity-80 ml-6"
                  >Login</a
                >
                <a
                  href="/src/pages/register/index.html"
                  class="text-brand-text hover:text-opacity-80 ml-6"
                  >Register</a
                >
              </div>

              <!-- Logged in state -->
              <div data-auth="logged-in" class="hidden">
                <a href="/" class="text-brand-text hover:text-opacity-80"
                  >Home</a
                >
                <a
                  href="/src/pages/create/index.html"
                  class="text-brand-text hover:text-opacity-80 ml-6 font-bold"
                  >Sell</a
                >
                <a
                  href="/src/pages/profile/index.html"
                  class="text-brand-text hover:text-opacity-80 ml-6"
                  >Profile</a
                >
                <span class="text-brand-text ml-6"
                  >Credits: <span data-credits>0</span></span
                >
                <button
                  class="text-brand-text hover:text-opacity-80 ml-6"
                  data-logout
                >
                  Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <main class="max-w-7xl mx-auto px-8 mt-16 mb-16">
        <h1 class="text-4xl font-semibold text-center text-brand-text mb-8">
          SELL
        </h1>

        <div class="bg-[#F4F3EE] rounded-lg p-8 max-w-xl mx-auto">
          <form id="create-listing-form" class="space-y-6">
            <div>
              <input
                type="text"
                id="title"
                name="title"
                required
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Title"
              />
            </div>

            <div>
              <textarea
                id="description"
                name="description"
                rows="4"
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Description"
              ></textarea>
            </div>

            <div>
              <input
                type="text"
                id="tags"
                name="tags"
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Tags (separated by comma)"
              />
            </div>

            <div>
              <input
                type="text"
                id="media"
                name="media"
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
                placeholder="Image URLs (separated by comma)"
              />
            </div>

            <div>
              <input
                type="datetime-local"
                id="endsAt"
                name="endsAt"
                required
                class="w-full p-3 rounded-lg focus:outline-none focus:border-brand-text"
              />
            </div>

            <button
              type="submit"
              class="w-full bg-[#E0AFA0] text-white px-6 py-3 rounded-lg hover:bg-opacity-90 transition-colors"
            >
              LIST
            </button>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
